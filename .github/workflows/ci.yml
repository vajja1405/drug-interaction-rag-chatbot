name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-unit-${{ hashFiles('requirements.txt', 'requirements-runtime.txt') }}

      - name: Install unit-test dependencies
        run: pip install pytest

      - name: Run classifier unit tests (no DB / LLM / vector store required)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_classifier.py --noconftest -v --tb=short

  search-and-gateway:
    name: Hybrid search + model gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies (no model downloads)
        run: pip install pytest numpy rank-bm25 httpx prometheus-client fastapi requests
      - name: Run hybrid-search and router tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_hybrid_search.py tests/test_model_router.py --noconftest -v --tb=short

  infrastructure:
    name: Kubernetes + Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
      - name: Validate both overlays against Kubernetes 1.31 schemas
        run: |
          for o in local production; do
            ./kustomize build k8s/overlays/$o | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -
          done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt + validate (no credentials, nothing applied)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check . --select=E,F,W --ignore=E501 || true

  integration-tests:
    name: Integration Tests (full stack)
    runs-on: ubuntu-latest
    # Only run on pushes to main to keep PR checks fast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-full-${{ hashFiles('requirements.txt', 'requirements-runtime.txt') }}

      - name: Install PyTorch (CPU-only for CI speed)
        run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install all dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Build fixture index
        env:
          OPENAI_API_KEY: sk-test-dummy
        run: python build_index.py --all-seed

      - name: Run full test suite
        env:
          OPENAI_API_KEY: sk-test-dummy
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short -x
